<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#131a26"/><stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="btc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbb045"/><stop offset=".5" stop-color="#f7931a"/><stop offset="1" stop-color="#d96f0e"/>
    </linearGradient>
    <style>
      .coin{transform-box:fill-box;transform-origin:center;animation:coinSpin 1.9s cubic-bezier(.4,.05,.6,.95) infinite}
      .coinface{transform-box:fill-box;transform-origin:center;animation:coinFace 1.9s cubic-bezier(.4,.05,.6,.95) infinite}
      @keyframes coinSpin{0%{transform:scaleX(1)}25%{transform:scaleX(0)}50%{transform:scaleX(-1)}75%{transform:scaleX(0)}100%{transform:scaleX(1)}}
      @keyframes coinFace{0%,10%{opacity:1}25%,75%{opacity:0}90%,100%{opacity:1}}
      .gleam{transform-box:fill-box;transform-origin:center;animation:gleam 1.9s ease-in-out infinite}
      @keyframes gleam{0%,100%{opacity:.85}25%,75%{opacity:.15}50%{opacity:.5}}
    </style>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#f0b90b" stroke-opacity=".55"/>
  <path d="M13 23h9l8 19 8-19h9L35 49h-9L13 23Z" fill="#f0f3fa"/>
