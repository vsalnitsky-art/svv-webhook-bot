<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSV — Мій кабінет</title>
  <link rel="icon" type="image/png" href="vsv-logo.png">
  <link rel="apple-touch-icon" href="vsv-logo.png">
  <link rel="stylesheet" href="style.css?v=69">
  <!-- ⏳ Анти-блимання: доки JS не перевірив авторизацію (клас app-ready ще не
       додано на <body>), не показуємо ні дашборд, ні hero — інакше на секунду
       спалахує «бот-панель» перед екраном входу. Після перевірки showData()
       додає app-ready і сам вирішує, що показати. -->
  <style>
    body:not(.app-ready) .topbar,
    body:not(.app-ready) .wrap > .card,
    body:not(.app-ready) .wrap > .iw-layout { display: none !important; }
    body:not(.app-ready) .wrap::before {
      content: ""; display: block; width: 34px; height: 34px; margin: 22vh auto 0;
      border: 3px solid rgba(148,163,184,.3); border-top-color: #94a3b8;
      border-radius: 50%; animation: vsvspin .8s linear infinite;
    }
    @keyframes vsvspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="vsv-logo.png" alt="VSV" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'">
      <span class="dot" style="display:none"></span>
      <span class="brand-name">VSV Bot</span><span class="brand-sub">· Мій кабінет</span>
    </div>
    <div class="top-actions">
      <nav id="auth-links" class="auth-links"></nav>
      <button id="theme-btn" class="pill" style="cursor:pointer;background:var(--elev)" title="Змінити тему" aria-label="Змінити тему">🌗</button>
      <div id="conn" class="conn conn--wait">● підключення…</div>
    </div>
  </header>

  <main class="wrap">

    <!-- 🔐 Гостьовий блок входу/реєстрації (показується, коли не авторизовано) -->
    <section class="card hero" id="auth-hero" style="display:none">
      <div class="hero-inner">
        <img class="hero-logo" src="vsv-logo.png" alt="VSV" onerror="this.style.display='none'">
        <h1 class="hero-title"><span class="brand-name">VSV Bot</span> — особистий кабінет</h1>
        <div class="hero-actions">
          <a id="hero-login" class="btn btn-primary" href="/login">🔐 Вхід</a>
          <a id="hero-register" class="btn btn-ghost" href="/register">📝 Реєстрація</a>
          <a id="hero-bot" class="btn btn-ghost" href="#" target="_blank" rel="noopener" style="display:none">📨 Telegram-бот</a>
        </div>
        <p class="hero-note">Реєстрація — через Telegram, без email. Напишіть боту <b>/start</b>.</p>
      </div>
    </section>

    <!-- 👤 Особиста сторінка: свій WATCHLIST + графік обраної монети -->
    <section class="iw-layout" id="iw-layout">
      <div class="card iw-wl">
        <h2>⭐ Мій WATCHLIST <span id="iw-count" class="pill">0</span></h2>
        <form class="iw-add" id="iw-add-form" autocomplete="off">
          <input id="iw-add-in" list="iw-universe" placeholder="BTC, ETHUSDT…" maxlength="24"
                 title="Будь-яка USDT-монета Bybit (до 20 монет). Монети з WATCHLIST бота (підказки в списку) показуються миттєво; решту сайт рахує окремо — дані зʼявляться за кілька секунд.">
          <datalist id="iw-universe"></datalist>
          <button type="submit" title="Додати монету у свій список">＋ Додати</button>
        </form>
        <div class="iw-msg" id="iw-msg"></div>
        <div class="iw-list" id="iw-list"><div class="iw-empty">завантаження…</div></div>
      </div>
      <div class="card iw-chart">
        <div class="iw-head" id="iw-head"><span class="iw-title">—</span></div>
        <div class="iw-tfbar" id="iw-tfbar">
          <div class="iw-tfs" id="iw-tfs" title="Таймфрейм графіка"></div>
          <label class="iw-sel" title="Order Blocks (internal + swing) — на якому таймфреймі шукати">OB
            <select id="iw-ob-tf"></select></label>
          <label class="iw-sel" title="Volumized Order Blocks — на якому таймфреймі шукати">VOB
            <select id="iw-vob-tf"></select></label>
          <div class="iw-tfs iw-layers" id="iw-layers" title="Що показувати на графіку"></div>
          <span class="iw-sel" id="iw-tf-wait"></span>
        </div>
        <div class="iw-box" id="iw-box"><div class="iw-note" id="iw-note">оберіть монету зі списку</div></div>
      </div>
    </section>

    <!-- 🔔 Мої сповіщення (для авторизованого користувача) -->
    <section class="card" id="notify-card" style="display:none">
      <h2>🔔 Сповіщення в Telegram</h2>
      <div id="notify-body">
        <div class="muted">завантаження…</div>
      </div>
    </section>

  </main>

  <footer class="foot">
    <span id="last-update" class="muted">—</span>
    <span class="muted">особистий список · дані з бота</span>
  </footer>

  <script>
    // Theme toggle (persists locally). Default = DARK unless the user chose otherwise.
    (function () {
      var KEY = "vsv-info-theme";
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      document.documentElement.setAttribute("data-theme", saved || "dark");
      document.addEventListener("click", function (e) {
        if (!e.target.closest || !e.target.closest("#theme-btn")) return;
        var cur = document.documentElement.getAttribute("data-theme");
        if (!cur) cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem(KEY, next); } catch (e) {}
      });
    })();
  </script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="config.js?v=69"></script>
  <script src="app.js?v=69"></script>
</body>
</html>
